
name: Import SWU Cards

on:
  # Allow manual imports
  workflow_dispatch:

  # Run every day at 10:17 UTC
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: swu-card-import
  cancel-in-progress: false

jobs:
  import-cards:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests supabase

      - name: Import card data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python import_cards.py
